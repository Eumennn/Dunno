<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dunno OS 404</title>
<meta name="description" content="404 page for dunno. The page is loading. It has been at 97% since you got here.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
  /* One idea, no furniture: a "loading" dialog that stops at 97%.
     Palette: ink #2B1E2F (ground), paper #FFF1D6 (text), orange #F2A65A (accent), cream #FFD29A (soft text). */
  :root {
    --ink: #2B1E2F;
    --ink-2: #3A2A40;
    --paper: #FFF1D6;
    --orange: #F2A65A;
    --cream: #FFD29A;
    --muted: #B79BB0;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 32px;
    padding-bottom: 32px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    background: var(--ink);
    color: var(--paper);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    min-width: 0;
  }

  .code {
    margin: 0;
    font-family: "Silkscreen", "Courier New", monospace;
    font-size: clamp(88px, 26vw, 168px);
    line-height: 0.9;
    color: var(--orange);
    letter-spacing: 0.02em;
  }
  h1 {
    margin: 0;
    font-size: clamp(22px, 4.5vw, 28px);
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .dialog {
    background: var(--ink-2);
    border: 2px solid var(--cream);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .dialog-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-family: "Silkscreen", "Courier New", monospace;
    font-size: 13px;
    color: var(--cream);
  }
  .track {
    height: 22px;
    border: 2px solid var(--cream);
    background: var(--ink);
    padding: 3px;
  }
  .fill {
    height: 100%;
    width: 0;
    background: repeating-linear-gradient(90deg, var(--orange) 0 10px, transparent 10px 12px);
  }

  .msg { margin: 0; color: var(--muted); min-height: 3em; text-wrap: pretty; }

  .btns { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    appearance: none;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    background: var(--paper);
    border: 2px solid var(--paper);
    padding: 10px 18px;
    min-height: 44px;
    text-decoration: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
  }
  .btn.ghost { background: transparent; color: var(--paper); }
  .btn:hover { background: var(--orange); border-color: var(--orange); color: var(--ink); }
  .btn.ghost:hover { background: transparent; color: var(--orange); border-color: var(--orange); }
  .btn:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .fill { transition: none; }
  }
</style>

<main>
  <p class="code" aria-hidden="true">404</p>

  <div>
    <h1>this page is still loading.</h1>
  </div>

  <section class="dialog" aria-labelledby="dlg">
    <div class="dialog-top">
      <span id="dlg">loading page…</span>
      <span id="pct">0%</span>
    </div>
    <div class="track" role="progressbar" aria-labelledby="dlg" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
      <div class="fill" id="fill"></div>
    </div>
    <p class="msg" id="msg" aria-live="polite">it'll be done soon. it has been soon for a while now.</p>
  </section>

  <div class="btns">
    <a class="btn" href="./">go home</a>
    <button type="button" class="btn ghost" id="wait">keep waiting</button>
  </div>
</main>

<script>
  (function () {
    var STOP = 97;
    var fill = document.getElementById("fill");
    var pct = document.getElementById("pct");
    var bar = document.getElementById("bar");
    var msg = document.getElementById("msg");
    var wait = document.getElementById("wait");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var value = 0;

    function show(v) {
      value = v;
      fill.style.width = v + "%";
      pct.textContent = Math.floor(v) + "%";
      bar.setAttribute("aria-valuenow", String(Math.floor(v)));
    }

    /* fill quickly, then stop at 97 and never finish */
    if (reduce) {
      show(STOP);
    } else {
      var start = null;
      var dur = 1800;
      requestAnimationFrame(function step(t) {
        if (start === null) start = t;
        var p = Math.min(1, (t - start) / dur);
        var eased = 1 - Math.pow(1 - p, 3);
        show(eased * STOP);
        if (p < 1) requestAnimationFrame(step);
      });
    }

    wait.addEventListener("click", function () {
      /* each click adds a tenth of a percent, never reaching 100 */
      var next = Math.min(STOP + 0.9, value + 0.1);
      if (value < STOP) {
        show(STOP);
      } else {
        show(next);
      }
      msg.textContent = value.toFixed(1) + "%. still not there.";
    });
  })();
</script>

</body></html>
