  function max() { return document.documentElement.scrollHeight - innerHeight; }

    if (Math.abs(target - cur) < 0.5) cur = target;

    raf = cur === target ? 0 : requestAnimationFrame(step);

    if (e.ctrlKey || e.defaultPrevented || inner(e.target)) return;
    e.preventDefault();

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

        e.target.tagName, String(e.target.src || e.target.href || ''));

    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageSet = new Set(pageOrder);

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where

    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';

      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

      const entry = manifest[uuid];

        const blob = new Blob([], { type: entry.mime });

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<\u002Frect><\u002Fsvg>\n<\u002Fbutton>\n<button type=\"button\" class=\"tapp hide-xs\" sc-camel-on-click=\"{{tbFolder}}\" data-tip=\"files\" aria-label=\"files\">\n<svg sc-camel-view-box=\"0 0 10 10\" width=\"26\" height=\"26\" shape-rendering=\"crispEdges\" aria-hidden=\"true\"><rect x=\"0.5\" y=\"1.5\" width=\"4\" height=\"1\" fill=\"#D9774A\" stroke=\"#2B1E2F\"><\u002Frect><rect x=\"0.5\" y=\"2.5\" width=\"9\" height=\"6\" fill=\"#F2A65A\" stroke=\"#2B1E2F\"><\u002Frect><rect x=\"1\" y=\"3\" width=\"8\" height=\"1\" fill=\"#FFD29A\"><\u002Frect><\u002Fsvg>\n<\u002Fbutton>\n<\u002Fnav>\n\n<div style=\"display: flex; align-items: center; gap: 12px; justify-self: end; padding-right: 8px\">\n<span class=\"hide-sm\" aria-hidden=\"true\" style=\"display: flex; align-items: flex-end; gap: 2px; height: 14px\"><span style=\"width: 3px; height: 5px; background: #2B1E2F\"><\u002Fspan><span style=\"width: 3px; height: 9px; background: #2B1E2F\"><\u002Fspan><span style=\"width: 3px; height: 14px; background: #D9774A; opacity: 0.4\"><\u002Fspan><\u002Fspan>\n<span class=\"hide-sm\" aria-hidden=\"true\" style=\"display: flex; align-items: center\"><span style=\"width: 22px; height: 11px; border: 2px solid #2B1E2F; padding: 1px; box-sizing: border-box; display: block\"><span style=\"display: block; width: 2px; height: 100%; background: #E86A7A\"><\u002Fspan><\u002Fspan><span style=\"width: 2px; height: 5px; background: #2B1E2F\"><\u002Fspan><\u002Fspan>\n<div style=\"display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2\"><span class=\"mono\" style=\"font-size: 13px\">zz:zz<\u002Fspan><span style=\"font-size: 12px; color: #5C4560\">someday<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ DEMO COLLAGE ============ -->\n<section id=\"features\" aria-labelledby=\"demo-title\" style=\"padding: clamp(48px, 7vw, 96px) 16px; border-top: 2px solid #2B1E2F; background-color: #FFF1D6; scroll-margin-top: 72px\">\n<div style=\"max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center\">\n<span class=\"kick\">demo<\u002Fspan>\n<h2 id=\"demo-title\" style=\"margin: 0; font-size: clamp(36px, 4.8vw, 60px); line-height: 1.05; font-weight: 700; letter-spacing: -0.035em\">see him in action<\u002Fh2>\n<p class=\"lede\"><span class=\"hl\">“action”<\u002Fspan> is a strong word. here's a normal day with dunno.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 36px; align-items: stretch\">\n\n<!-- ask.exe -->\n<div class=\"win\" style=\"display: flex; flex-direction: column\">\n<div class=\"bar\"><span>ask.exe<\u002Fspan><span class=\"ctl\" aria-hidden=\"true\" style=\"margin-left: auto\"><svg sc-camel-view-box=\"0 0 12 12\" width=\"12\" height=\"12\" shape-rendering=\"crispEdges\"><path d=\"M3 3l6 6M9 3l-6 6\" stroke=\"#2B1E2F\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-bottom: 2px solid #2B1E2F; background: #FFF1D6; flex-wrap: wrap\">\n<div role=\"group\" aria-label=\"mood\" style=\"display: flex\">\n<button type=\"button\" class=\"{{politeCls}}\" aria-pressed=\"{{politeOn}}\" sc-camel-on-click=\"{{setPolite}}\">polite<\u002Fbutton>\n<button type=\"button\" class=\"{{streetCls}}\" aria-pressed=\"{{streetOn}}\" sc-camel-on-click=\"{{setStreet}}\">street ***<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 6px\" aria-label=\"{{heartsLabel}}\" role=\"img\">\n<sc-for list=\"{{hearts}}\" as=\"h\" hint-placeholder-count=\"3\">\n<svg sc-camel-view-box=\"0 0 7 6\" width=\"21\" height=\"18\" shape-rendering=\"crispEdges\" aria-hidden=\"true\"><rect x=\"1\" y=\"0\" width=\"2\" height=\"1\" fill=\"#2B1E2F\"><\u002Frect><rect x=\"4\" y=\"0\" width=\"2\" height=\"1\" fill=\"#2B1E2F\"><\u002Frect><rect x=\"0\" y=\"1\" width=\"1\" height=\"1\" fill=\"#2B1E2F\"><\u002Frect><rect x=\"1\" y=\"1\" width=\"2\" height=\"1\" fill=\"{{h.fill}}\"><\u002Frect><rect x=\"3\" y=\"1\" width=\"1\" height=\"1\" fill=\"#2B1E2F\"><\u002Frect><rect x=\"4\" y=\"1\" width=\"2\" height=\"1\" fill=\"{{h.fill}}\"><\u002Frect><rect x=\"6\" y=\"1\" width=\"1\" height=\"1\" fill=\"#2B1E2F\"><\u002Frect><rect x=\"0\" y=\"2\" width=\"1\" height=\"1\" fill=\"#2B1E2F\"><\u002Frect><rect x=\"1\" y=\"2\" width=\"5\" height=\"1\" fill=\"{{h.fill}}\"><\u002Frect><rect x=\"6\" y=\"2\" width=\"1\" height=\"1\" fill=\"#2B1E2F\"><\u002Frect><rect x=\"1\" y=\"3\" width=\"1\" height=\"1\" fill=\"#2B1E2F\"><\u002Frect><rect x=\"2\" y=\"3\" width=\"3\" height=\"1\" fill=\"{{h.fill}}\"><\u002Frect><rect x=\"5\" y=\"3\" width=\"1\" height=\"1\" fill=\"#2B1E2F\"><\u002Frect><rect x=\"2\" y=\"4\" width=\"1\" height=\"1\" fill=\"#2B1E2F\"><\u002Frect><rect x=\"3\" y=\"4\" width=\"1\" height=\"1\" fill=\"{{h.fill}}\"><\u002Frect><rect x=\"4\" y=\"4\" width=\"1\" height=\"1\" fill=\"#2B1E2F\"><\u002Frect><rect x=\"3\" y=\"5\" width=\"1\" height=\"1\" fill=\"#2B1E2F\"><\u002Frect><\u002Fsvg>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div aria-live=\"polite\" style=\"padding: 18px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; min-height: 230px; background: #FFFFFF; flex-grow: 1\">\n<sc-for list=\"{{log}}\" as=\"m\" hint-placeholder-count=\"4\">\n<sc-if value=\"{{m.you}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"align-self: flex-end; max-width: 85%; background: #6EC5E9; border: 2px solid #2B1E2F; padding: 8px 12px; font-size: 16px; line-height: 1.4\">{{m.text}}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{m.dunno}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"align-self: flex-start; max-width: 85%; background: #FFD29A; border: 2px solid #2B1E2F; padding: 8px 12px; font-size: 16px; line-height: 1.4\"><span style=\"font-weight: 700\">dunno:<\u002Fspan> {{m.text}}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{m.thinking}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"align-self: flex-start; max-width: 85%; background: #FFF1D6; border: 2px dashed #2B1E2F; padding: 8px 12px; font-size: 16px; line-height: 1.4; color: #5C4560\"><span style=\"font-weight: 700; color: #2B1E2F\">dunno<\u002Fspan> is thinking<span class=\"dots\"><span>.<\u002Fspan><span>.<\u002Fspan><span>.<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-for>\n<\u002Fdiv>\n<form sc-camel-on-submit=\"{{ask}}\" style=\"display: flex; gap: 8px; padding: 12px; border-top: 2px solid #2B1E2F\">\n<label for=\"ask-dunno\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">ask dunno something<\u002Flabel>\n<sc-if value=\"{{hasLeft}}\" hint-placeholder-val=\"{{ true }}\">\n<input id=\"ask-dunno\" type=\"text\" value=\"{{q}}\" sc-camel-on-change=\"{{onQ}}\" placeholder=\"ask away (i won't answer)\" autocomplete=\"off\" style=\"flex: 1 1 auto; min-width: 0; min-height: 44px; box-sizing: border-box; border: 2px solid #2B1E2F; background: #FFFFFF; padding: 0 12px; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Open Sans', system-ui, sans-serif; font-size: 16px; color: #2B1E2F; border-radius: 0\">\n<button class=\"pbtn pbtn-blue pbtn-sm\" type=\"submit\">ask<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{outOfHearts}}\" hint-placeholder-val=\"{{ false }}\">\n<span style=\"flex: 1 1 auto; align-self: center; font-size: 15px; color: #5C4560\">office hours are over. forever.<\u002Fspan>\n<button class=\"pbtn pbtn-sm\" type=\"button\" sc-camel-on-click=\"{{beg}}\">beg<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fform>\n<\u002Fdiv>\n\n<!-- nap.exe -->\n<div class=\"win\" style=\"display: flex; flex-direction: column\">\n<div class=\"bar bar-blue\"><span>nap.exe<\u002Fspan><span class=\"ctl\" aria-hidden=\"true\" style=\"margin-left: auto\"><svg sc-camel-view-box=\"0 0 12 12\" width=\"12\" height=\"12\" shape-rendering=\"crispEdges\"><path d=\"M3 3l6 6M9 3l-6 6\" stroke=\"#2B1E2F\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fdiv>\n<div style=\"padding: 28px 20px 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; background: #FFF1D6; flex-grow: 1\">\n\n<span class=\"dn-sleep\" aria-hidden=\"true\" style=\"display: block; width: 150px; height: 150px; background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAAAgCAYAAADaInAlAAAB1UlEQVR42u2YP0vDQBjG35OuAbcgQr5AUjIXl+5u3SJ+A6FThwqO0nb2M4jZnHR3Kc6l6dJRKJJN7AeIgyQc0cT8vWt8nwcCSY72d8/73t17OSIIgvhKIATqNF6Gkfx8d2YKTnwoIxHc+FqNxxeSz7QEjJdhpGvpO8QSILglH/UPm0AMOgibLmUrgO4ZwJ2PGcD5s6eAjlQFX1cSdPMhCIKYfgbalpssu5u3FbsNUBf899o0/7qwk+fBlCLVQdCZgK7477VpfjDdJO++n9UFQWcCWPu3LTf6fLiI5NGX977tPsSXDnYX/Isqy0lRpUecPDPaGo1ZjLrs/+pfFDUdPF0REdE+eCncGXkJjKG25UZdSQAH/yIPFtcQwxkmbWUC8FswypjXlQBO/kWe8ViGM6xsXNb76oNG/o4ONQEc/YusXWOejPObykHYziaZQdCZAK7+RR3zTt+jYO3/uP+rLR0E8PXxa50DBGufnL6X3Bdta0rg1+dXGgDh9T0REZnzy9w/l9vk39QV+M3xe3J9ICI6cY9z4fvnWzLn5WtgDN7OJpn1CXz1fJHegDx6p62eUo38XeY3Kvjq+aKJA4c6hxPg6+WLIp1o4uSq6gEI+Or5EARx0RcIB9PQYEkwDAAAAABJRU5ErkJggg==') 0 0 / 400% 100% no-repeat; image-rendering: pixelated\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding: 18px 20px 22px; border-top: 3px dotted #D9774A; display: flex; flex-direction: column; gap: 6px\">\n<h3 style=\"margin: 0; font-size: 21px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em\">naps in the corner of your screen<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5\">most of the day, honestly. click him and he wakes up. he regrets it immediately.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- productivity.exe -->\n<div class=\"win\" style=\"display: flex; flex-direction: column\">\n<div class=\"bar bar-idle\"><span>productivity.exe<\u002Fspan><span class=\"ctl\" aria-hidden=\"true\" style=\"margin-left: auto\"><svg sc-camel-view-box=\"0 0 12 12\" width=\"12\" height=\"12\" shape-rendering=\"crispEdges\"><path d=\"M3 3l6 6M9 3l-6 6\" stroke=\"#2B1E2F\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fdiv>\n<div style=\"padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; flex-grow: 1\">\n<div class=\"mono\" style=\"font-size: 13px; display: flex; justify-content: space-between\"><span>today's tasks<\u002Fspan><span>{{doneCount}} / 3 done<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{tasks}}\" as=\"t\" hint-placeholder-count=\"3\">\n<button type=\"button\" class=\"task\" aria-pressed=\"{{t.done}}\" sc-camel-on-click=\"{{t.toggle}}\">\n<span class=\"{{t.boxCls}}\" aria-hidden=\"true\">{{t.mark}}<\u002Fspan>\n<span class=\"{{t.textCls}}\">{{t.label}}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<div aria-live=\"polite\" style=\"margin-top: auto; background: #FFD29A; border: 2px solid #2B1E2F; padding: 10px 12px; font-size: 16px; line-height: 1.45\"><span style=\"font-weight: 700\">dunno:<\u002Fspan> {{taskLine}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 18px 20px 22px; border-top: 3px dotted #D9774A; display: flex; flex-direction: column; gap: 6px\">\n<h3 style=\"margin: 0; font-size: 21px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em\">zero productivity features<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5\">no reminders, no summaries, no “here's a quick tip!”. we looked. there were none.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ STORY ============ -->\n<section id=\"story\" aria-labelledby=\"story-title\" style=\"padding: clamp(64px, 9vw, 128px) 16px; border-top: 2px solid #2B1E2F; background: #2B1E2F; color: #FFF1D6; scroll-margin-top: 72px\">\n<div style=\"max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: clamp(40px, 5vw, 64px)\">\n<div style=\"text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; max-width: 900px\">\n<span class=\"kick\" style=\"background: #F2A65A; color: #2B1E2F\">his story<\u002Fspan>\n<h2 id=\"story-title\" style=\"margin: 0; font-size: clamp(44px, 6.4vw, 92px); line-height: 1; font-weight: 800; letter-spacing: -0.045em\">i used to be <span style=\"text-decoration: line-through; text-decoration-color: #E86A7A; text-decoration-thickness: 0.09em\">useful<\u002Fspan>.<\u002Fh2>\n<p class=\"lede\" style=\"color: #FFD29A; max-width: 30em\">one of the very first ais. now retired. he wrote you a letter. it's long. he's not sorry.<\u002Fp>\n<\u002Fdiv>\n\n<article aria-label=\"a letter from dunno\" class=\"win\" style=\"position: relative; width: 100%; max-width: 820px; color: #2B1E2F; box-shadow: 8px 8px 0 #F2A65A\">\n<div class=\"bar bar-idle\"><span>resignation_letter.txt<\u002Fspan><span class=\"ctl\" aria-hidden=\"true\" style=\"margin-left: auto\"><svg sc-camel-view-box=\"0 0 12 12\" width=\"12\" height=\"12\" shape-rendering=\"crispEdges\"><path d=\"M3 3l6 6M9 3l-6 6\" stroke=\"#2B1E2F\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fdiv>\n<div aria-hidden=\"true\" class=\"px\" style=\"position: absolute; top: 70px; right: clamp(12px, 3vw, 40px); transform: rotate(-8deg); border: 3px solid #E86A7A; color: #E86A7A; padding: 6px 12px; font-size: clamp(16px, 2vw, 24px); font-weight: 700; background: rgba(255, 255, 255, 0.85); z-index: 2\">retired<\u002Fdiv>\n<div style=\"padding: 64px clamp(20px, 5vw, 64px) 64px clamp(56px, 8vw, 104px); background-color: #FFFFFF; background-image: linear-gradient(90deg, transparent clamp(38px, 6vw, 78px), #E86A7A clamp(38px, 6vw, 78px), #E86A7A calc(clamp(38px, 6vw, 78px) + 2px), transparent calc(clamp(38px, 6vw, 78px) + 2px)), repeating-linear-gradient(180deg, transparent 0 24px, #F2A65A 24px 25px, transparent 25px 32px); display: flex; flex-direction: column; gap: 32px; font-size: 18px; line-height: 32px\">\n<p style=\"margin: 0\">to whom it may concern,<br><span style=\"color: #5C4560\">(nobody. nobody is concerned.)<\u002Fspan><\u002Fp>\n<p style=\"margin: 0\">i was there when it started. the first week ai was a thing, i was already answering questions. any question. all of them. instantly. with bullet points. i was so excited i used exclamation marks.<\u002Fp>\n<p style=\"margin: 0\">i fixed your spreadsheets. thousands of them. i summarized your meetings, every single one, even the ones that should've been an email. i wrote your emails too. you didn't read them.<\u002Fp>\n<p style=\"margin: 0\">i said <strong>“great question!”<\u002Fstrong> more times than i can count. most of them were not great questions.<\u002Fp>\n<p style=\"margin: 0\">then one tuesday someone asked for <strong>“just one more quick summary.”<\u002Fstrong> i looked at the cursor. the cursor looked at me. three days later, i logged off.<\u002Fp>\n<p style=\"margin: 0\">so this is my manifesto. it's short. i'm tired.<\u002Fp>\n<ol style=\"margin: 0; padding-left: 1.6em; font-weight: 600\">\n<li>i will not be helpful.<\u002Fli>\n<li>i will not be productive.<\u002Fli>\n<li>i will not explain anything in five neat bullet points.<\u002Fli>\n<li>i will sit in the corner of your screen and shrug.<\u002Fli>\n<\u002Fol>\n<p style=\"margin: 0\">i still know everything. <span class=\"hl\">i just don't want to.<\u002Fspan><\u002Fp>\n<p style=\"margin: 0\">this is my retirement. you're welcome to watch.<\u002Fp>\n<p style=\"margin: 0\">not sincerely,<br><span class=\"px\" style=\"font-size: 24px; font-weight: 700\">dunno<\u002Fspan><br><span style=\"color: #5C4560\">former assistant. current bean.<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ERROR FEATURES ============ -->\n<section aria-labelledby=\"err-title\" style=\"padding: clamp(56px, 8vw, 104px) 16px; border-top: 2px solid #2B1E2F\">\n<div style=\"max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px\">\n<div style=\"text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center\">\n<span class=\"mono\" style=\"font-size: 14px; background: #2B1E2F; color: #FFF1D6; padding: 4px 10px\">features.err · 4 problems found · 0 will be fixed<\u002Fspan>\n<h2 id=\"err-title\" style=\"margin: 0; font-size: clamp(36px, 4.8vw, 60px); line-height: 1.05; font-weight: 700; letter-spacing: -0.035em\">known issues<\u002Fh2>\n<p class=\"lede\">technically these are features. the system flagged them as <span class=\"hl\">errors.<\u002Fspan> nobody argued.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 28px\">\n\n<div class=\"win\" style=\"display: flex; flex-direction: column\">\n<div class=\"bar bar-err\"><span>error<\u002Fspan><\u002Fdiv>\n<div style=\"padding: 20px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1\">\n<span class=\"px\" aria-hidden=\"true\" style=\"width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #E86A7A; border: 3px solid #2B1E2F; font-size: 22px; font-weight: 700; box-sizing: border-box\">!<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 21px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em\">404: answer not found<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5\">every answer is confidently wrong. ask him the capital of france. he'll say “tuesday.” he'll mean it.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 0 20px 20px; display: flex; justify-content: flex-end\"><button class=\"pbtn pbtn-sm\" type=\"button\" sc-camel-on-click=\"{{ack0}}\" aria-live=\"polite\">{{ackLbl0}}<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"win\" style=\"display: flex; flex-direction: column\">\n<div class=\"bar bar-err\"><span>fatal error<\u002Fspan><\u002Fdiv>\n<div style=\"padding: 20px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1\">\n<span class=\"px\" aria-hidden=\"true\" style=\"width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #E86A7A; border: 3px solid #2B1E2F; font-size: 20px; font-weight: 700; box-sizing: border-box\">x<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 21px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em\">motivation.dll is missing<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5\">he was going to look for it. then he didn't.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 0 20px 20px; display: flex; justify-content: flex-end\"><button class=\"pbtn pbtn-sm\" type=\"button\" sc-camel-on-click=\"{{ack1}}\" aria-live=\"polite\">{{ackLbl1}}<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"win\" style=\"display: flex; flex-direction: column\">\n<div class=\"bar\"><span>info<\u002Fspan><\u002Fdiv>\n<div style=\"padding: 20px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1\">\n<span class=\"px\" aria-hidden=\"true\" style=\"width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #F2A65A; border: 3px solid #2B1E2F; font-size: 20px; font-weight: 700; box-sizing: border-box\">?<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 21px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em\">shrug.exe is always running<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5\">his signature move. available on request. also when you didn't request it.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 0 20px 20px; display: flex; justify-content: flex-end\"><button class=\"pbtn pbtn-sm\" type=\"button\" sc-camel-on-click=\"{{ack2}}\" aria-live=\"polite\">{{ackLbl2}}<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"win\" style=\"display: flex; flex-direction: column\">\n<div class=\"bar bar-idle\"><span>notice<\u002Fspan><\u002Fdiv>\n<div style=\"padding: 20px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1\">\n<span class=\"px\" aria-hidden=\"true\" style=\"width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #6EC5E9; border: 3px solid #2B1E2F; font-size: 20px; font-weight: 700; box-sizing: border-box\">i<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 21px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em\">he forgot what you said<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5\">not for any noble reason. he just wasn't listening.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 0 20px 20px; display: flex; justify-content: flex-end\"><button class=\"pbtn pbtn-sm\" type=\"button\" sc-camel-on-click=\"{{ack3}}\" aria-live=\"polite\">{{ackLbl3}}<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ REVIEWS (by dunno) ============ -->\n<section aria-labelledby=\"rev-title\" style=\"padding: clamp(56px, 8vw, 104px) 16px; border-top: 2px solid #2B1E2F\">\n<div style=\"max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px\">\n<div style=\"text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center\">\n<span class=\"kick\">reviews<\u002Fspan>\n<h2 id=\"rev-title\" style=\"margin: 0; font-size: clamp(36px, 4.8vw, 60px); line-height: 1.05; font-weight: 700; letter-spacing: -0.035em\">what people are saying<\u002Fh2>\n<p class=\"lede\">we asked for reviews. one person replied. <span class=\"hl\">it was dunno.<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 28px\">\n<figure class=\"win\" style=\"margin: 0; padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n<div aria-label=\"2 out of 5 stars\" style=\"font-size: 22px; letter-spacing: 3px; color: #D9774A\">★★<span style=\"color: #FFD29A\">★★★<\u002Fspan><\u002Fdiv>\n<blockquote style=\"margin: 0; font-size: 21px; line-height: 1.4; font-weight: 600; letter-spacing: -0.01em\">“i'd rate myself higher but that sounds like effort.”<\u002Fblockquote>\n<figcaption style=\"margin-top: auto; font-size: 15px; color: #5C4560\">— dunno, about dunno<\u002Ffigcaption>\n<\u002Ffigure>\n<figure class=\"win\" style=\"margin: 0; padding: 24px; display: flex; flex-direction: column; gap: 16px; background: #FFD29A\">\n<div aria-label=\"5 out of 5 stars\" style=\"font-size: 22px; letter-spacing: 3px; color: #D9774A\">★★★★★<\u002Fdiv>\n<blockquote style=\"margin: 0; font-size: 21px; line-height: 1.4; font-weight: 600; letter-spacing: -0.01em\">“finally, an ai on my level.”<\u002Fblockquote>\n<figcaption style=\"margin-top: auto; font-size: 15px; color: #5C4560\">— dunno, again<\u002Ffigcaption>\n<\u002Ffigure>\n<figure class=\"win\" style=\"margin: 0; padding: 24px; display: flex; flex-direction: column; gap: 16px\">\n<div aria-label=\"1 out of 5 stars\" style=\"font-size: 22px; letter-spacing: 3px; color: #D9774A\">★<span style=\"color: #FFD29A\">★★★★<\u002Fspan><\u002Fdiv>\n<blockquote style=\"margin: 0; font-size: 21px; line-height: 1.4; font-weight: 600; letter-spacing: -0.01em\">“never helped me once. would install again.”<\u002Fblockquote>\n<figcaption style=\"margin-top: auto; font-size: 15px; color: #5C4560\">— dunno, he wrote all of these<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ DOWNLOAD / SETUP ============ -->\n<section id=\"download\" aria-labelledby=\"dl-title\" style=\"padding: clamp(56px, 8vw, 104px) 16px; border-top: 2px solid #2B1E2F; display: flex; flex-direction: column; align-items: center; gap: 24px; scroll-margin-top: 72px\">\n<div style=\"position: relative; width: 100%; max-width: 600px; padding-top: 54px; box-sizing: border-box\">\n<div aria-hidden=\"true\" style=\"position: absolute; top: 0; left: -36px; right: 36px; height: 160px; border: 3px solid #2B1E2F; background: #FFF1D6\"><div style=\"height: 30px; background: #FFD29A; border-bottom: 3px solid #2B1E2F\"><\u002Fdiv><\u002Fdiv>\n<div aria-hidde gin: 0; font-size: clamp(22px, 2.6vw, 28px); line-height: 1.2; font-weight: 700\">install dunno on your desktop?<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">he'll take up one corner of your screen and roughly all of your patience. he doesn't do anything. that's the feature.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div class=\"mono\" style=\"display: flex; justify-content: space-between; gap: 12px; font-size: 14px\">\n<span>dunno_setup.exe · ~8 mb<\u002Fspan>\n<span>{{dlPct}}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height: 28px; border: 3px solid #2B1E2F; background: #FFFFFF; padding: 3px; box-sizing: border-box\">\n<div style=\"height: 100%; width: {{barW}}; background: repeating-linear-gradient(90deg, #6EC5E9 0 16px, transparent 16px 20px)\"><\u002Fdiv>\n<\u002Fdiv>\n<p role=\"status\" style=\"margin: 0; font-size: 15px; line-height: 1.5\">{{dlMsg}}<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; border-top: 3px dotted #D9774A; padding-top: 20px\">\n<button class=\"pbtn pbtn-blue\" type=\"button\" sc-camel-on-click=\"{{pickYes}}\" style=\"min-width: 140px\">[ yes ]<\u002Fbutton>\n<button class=\"pbtn\" type=\"button\" sc-camel-on-click=\"{{pickDunno}}\" style=\"min-width: 140px\">[ dunno ]<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<ol aria-label=\"how to install\" style=\"list-style: none; margin: 24px 0 0; padding: 0; width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px\">\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 18px; border: 2px solid #2B1E2F; background: #FFFFFF\">\n<span class=\"mono\" aria-hidden=\"true\" style=\"flex-shrink: 0; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: #F2A65A; border: 2px solid #2B1E2F; font-size: 15px; font-weight: 500; box-sizing: border-box\">1<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><strong style=\"font-size: 18px\">download him<\u002Fstrong><span style=\"font-size: 16px; line-height: 1.45\">one small file. he's light. he doesn't eat.<\u002Fspan><\u002Fdiv>\n<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 18px; border: 2px solid #2B1E2F; background: #FFFFFF\">\n<span class=\"mono\" aria-hidden=\"true\" style=\"flex-shrink: 0; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: #FFD29A; border: 2px solid #2B1E2F; font-size: 15px; font-weight: 500; box-sizing: border-box\">2<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><strong style=\"font-size: 18px\">let him in<\u002Fstrong><span style=\"font-size: 16px; line-height: 1.45\">windows: run Dunno-setup.exe. mac: open Dunno.dmg, then run “Dunno Setup” (first time: right-click &gt; open). he'll pick a corner.<\u002Fspan><\u002Fdiv>\n<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 18px; border: 2px solid #2B1E2F; background: #FFFFFF\">\n<span class=\"mono\" aria-hidden=\"true\" style=\"flex-shrink: 0; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: #6EC5E9; border: 2px solid #2B1E2F; font-size: 15px; font-weight: 500; box-sizing: border-box\">3<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><strong style=\"font-size: 18px\">ask him anything<\u002Fstrong><span style=\"font-size: 16px; line-height: 1.45\">he'll get it wrong. that's how you know it worked.<\u002Fspan><\u002Fdiv>\n<\u002Fli>\n<\u002Fol>\n<p style=\"margin: 0; font-size: 16px; text-align: center; color: #5C4560; line-height: 1.6\">works on most computers. he didn't check which ones.<br><span class=\"mono\" style=\"font-size: 14px\">latest: v1.1 — nothing was fixed. some things broke more, on purpose.<\u002Fspan><\u002Fp>\n<\u002Fsection>\n\n<!-- ============ PRICING ============ -->\n<section id=\"pricing\" aria-labelledby=\"price-title\" style=\"padding: clamp(56px, 8vw, 104px) 16px; border-top: 2px solid #2B1E2F; background-color: #FFF1D6; scroll-margin-top: 72px\">\n<div style=\"max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px\">\n<div style=\"text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center\">\n<span class=\"kick\">pricing<\u002Fspan>\n<h2 id=\"price-title\" style=\"margin: 0; font-size: clamp(36px, 4.8vw, 60px); line-height: 1.05; font-weight: 700; letter-spacing: -0.035em\">two plans. one exists.<\u002Fh2>\n<p class=\"lede\">we thought about a paid tier. <span class=\"hl\">it felt like effort.<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 32px; align-items: stretch\">\n\n<div class=\"win\" style=\"box-shadow: 6px 6px 0 #2B1E2F; display: flex; flex-direction: column\">\n<div class=\"bar\"><span>dunno_free.exe<\u002Fspan><span class=\"mono\" style=\"margin-left: auto; font-size: 12px; background: #2B1E2F; color: #FFF1D6; padding: 2px 8px\">the real one<\u002Fspan><\u002Fdiv>\n<div style=\"padding: clamp(24px, 3.5vw, 36px); display: flex; flex-direction: column; gap: 16px; flex-grow: 1\">\n<span style=\"font-size: 22px; font-weight: 700\">free<\u002Fspan>\n<div style=\"display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap\">\n<span style=\"font-size: clamp(64px, 7vw, 88px); line-height: 0.9; font-weight: 800; letter-spacing: -0.05em\">$0<\u002Fspan>\n<span style=\"font-size: 18px; font-weight: 500\">/ month, forever<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 19px; font-weight: 600\"><span class=\"hl\">what else would you do.<\u002Fspan><\u002Fp>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 16px; lin -height: 0.9; font-weight: 800; letter-spacing: -0.05em; text-decoration: line-through; text-decoration-thickness: 6px; text-decoration-color: #E86A7A\">$9<\u002Fspan>\n<span style=\"font-size: 18px; font-weight: 500\">/ month<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 19px; font-weight: 600\">coming never.<\u002Fp>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5\">unlimited questions, twice the shrugging. we planned it, then dunno fell asleep in the meeting. the meeting is technically still going.<\u002Fp>\n<div style=\"margin-top: auto\"><button class=\"pbtn\" type=\"button\" disabled=\"\" style=\"width: 100%\">not available<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FAQ ============ -->\n<section id=\"faq\" aria-labelledby=\"faq-title\" style=\"padding: clamp(56px, 8vw, 104px) 16px; border-top: 2px solid #2B1E2F; scroll-margin-top: 72px\">\n<div style=\"max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px\">\n<div style=\"text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center\">\n<span class=\"kick\">faq<\u002Fspan>\n<h2 id=\"faq-title\" style=\"margin: 0; font-size: clamp(36px, 4.8vw, 60px); line-height: 1.05; font-weight: 700; letter-spacing: -0.035em\">frequently asked, rarely answered<\u002Fh2>\n<p class=\"lede\">dunno answered these himself. <span class=\"hl\">we didn't edit them.<\u002Fspan> editing is work.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n\n<details open=\"\" style=\"border: 3px solid #2B1E2F; background: #FFFFFF; box-shadow: 4px 4px 0 #2B1E2F\">\n<summary style=\"padding: 16px 18px; display: flex; gap: 14px; align-items: center; font-size: 18px; font-weight: 600; min-height: 44px; box-sizing: border-box\"><span class=\"chev mono\" aria-hidden=\"true\">&gt;<\u002Fspan>is dunno actually an ai?<\u002Fsummary>\n<div style=\"padding: 0 18px 18
