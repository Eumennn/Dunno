# Masaüstü derlemesi (SPEC 19): macOS .dmg (Apple Silicon + Intel, universal) ve Windows setup.exe.
# Sadece elle çalıştırılır (Actions > desktop build > Run workflow). Çıktılar "artifacts" olarak indirilir.
# Her push'ta çalışmaz: özel repoda Actions dakikası sınırlı (macOS dakikası 10 kat sayılır). Yayın için release.yml.
# İmzasız: Mac'te ilk açılışta sağ tık > Aç gerekir (docs/RELEASE.md "Mac imza ve notarization"). Sırlar burada yok.
name: desktop build

on:
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: dunno-macos-dmg
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: dunno-windows-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
